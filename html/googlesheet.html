<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Document</title>
</head>
<body>
    <h1>Lista de Personas</h1>
    <ol id="lista"></ol>

    <script>
        const lista = document.getElementById('lista');

        fetch('https://docs.google.com/spreadsheets/d/e/2PACX-1vQOfG7qBY_hQOY7FTG65dDlLz-G7xv0LyyHzc10AnzJp8vgzd1NcHlyR_LztLk_AscAnjomorSx2bmM/pub?output=csv')
            .then(response => response.text())
            .then(data => {
                const rows = data.split('\n').slice(1); // Omitir la primera fila (encabezados)
                rows.forEach(row => {
                    const [nombre, edad, correo] = row.split(',');
                    const li = document.createElement('li');
                    li.textContent = `Nombre: ${nombre} - Edad: ${edad} - Correo: ${correo}`;
                    lista.appendChild(li);
                });
            })
            .catch(error => console.error('Error al cargar el archivo CSV:', error));
    </script>
</body>
</html>
