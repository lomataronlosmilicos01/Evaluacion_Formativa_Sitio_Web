    <h1>Lista de datos</h1>
    <ul id="lista"></ul>
    <script>
        fetch("../json/datos.json")
         .then(res => res.json())
         .then(personas =>{
       let viejos = personas.filter(p => p.edad > 25);
       let html = viejos.map(p => `<li>${p.nombre} (${p.edad} años) - ${p.correo}</li>`).join("");
       document.getElementById("lista").innerHTML = html;
    });
</script>
