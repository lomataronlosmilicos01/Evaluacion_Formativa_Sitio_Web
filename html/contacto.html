<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../img/ulagos.jpg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/style.css">
    <title>Mi primer Sitio</title>
   
</head>
<body>
    <header>
        <h1>Formulario de Inscripción</h1>
    </header>
    <nav>
        <ul>
            <li><a href="../index.html">Inicio</a></li>
            <li><a href= "acercade.html"> Acerca de</a></li>
            <li><a href="servicios.html" >Servicios</a></li>     
        </ul>
    </nav>
<form action="" method="get">
    <fieldset>
        <legend>Datos Personales</legend>
    <div>
     <label for="nombre">Nombre:</label>
     <input type="text" id="nombre" name="nombre">

     <label for="apellido">Apellido:</label>
     <input type="text" id="apellido" name="apellido"> 
    </div> 

    <br>
     
    <div>
    <label for="telefono">Teléfono:</label>
    <input type="tel" id="telefono" name="telefono"> 
    <label for="region">Región:</label> 
    <select id="region" name="region">
     <option value="">Seleccione una región</option> 
     <option value="metropolitana">Metropolitana</option> 
     <option value="antofagasta">Antofagasta</option> 
     <option value="atacama">Atacama</option> 
     <option value="loslagos">Los Lagos</option>
     </select> 
     </div> 
     <br> 
     <div> 
    <label for="nacimiento">Fecha de nacimiento:</label> 
    <input type="date" id="nacimiento" name="nacimiento">
    </div>    
    </fieldset>
   
    <fieldset>
    <legend>Información académica</legend>

<div style="display: flex; gap: 100px;">

    <div>
        <label>Nivel educacional:</label>
        <br>

        <input type="radio" id="media" name="nivel" value="media">
        <label for="media">Enseñanza media</label>
        <br>

        <input type="radio" id="tecnico" name="nivel" value="tecnico">
        <label for="tecnico">Técnico</label>
        <br>

        <input type="radio" id="universitario" name="nivel" value="universitario">
        <label for="universitario">Universitario</label>
        <br>

        <input type="radio" id="otro" name="nivel" value="otro">
        <label for="otro">Otro</label>
    </div>

    <div>
        <label for="carrera">Carrera de interés:</label>
        <br>

        <select id="carrera" name="carrera">
            <option value="">Seleccione una carrera</option>
            <option value="informatica">Ingeniería en Informática</option>
            <option value="tec.informatica">Técnico en Informática</option>
        </select>
    </div>

</div>


</fieldset>

    <fieldset>
        <legend> Áreas de interés </legend>
          <div class="form-check">
  <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault">
  <label class="form-check-label" for="flexCheckDefault">
    Salud
  </label>
</div>
<div class="form-check">
  <input class="form-check-input" type="checkbox" value="" id="flexCheckChecked" checked>
  <label class="form-check-label" for="flexCheckChecked">
    Tecnología
  </label>
</div>
<div class="form-check">
  <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault">
  <label class="form-check-label" for="flexCheckDefault">
    Educación
  </label>
</div>
<div class="form-check">
  <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault">
  <label class="form-check-label" for="flexCheckDefault">
    Administración
  </label>
</div>
    </fieldset>

    <fieldset> 
        <legend> Mensaje u Observaciones</legend>
    <label for="mensaje">mensaje:</label>
    <textarea id="mensaje" name="mensaje"></textarea>
    <button type="submit">Enviar</button>
    </fieldset>

<br>

<label for="curriculum">Adjuntar currículum (opcional):</label>
<input type="file" id="curriculum" name="curriculum">

<br><br>

<button type="submit">Enviar formulario</button>
<button type="reset">Limpiar</button>

</form>

</form>
