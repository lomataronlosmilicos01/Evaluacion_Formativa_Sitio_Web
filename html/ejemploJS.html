<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de JS</title>
    <script>
        function Feliz(){
            document.getElementById("japi").src="../img/japiface.jpg";
        }
       
         function Triste(){
            document.getElementById("japi").src="../img/sadface.jpg";
         }
        


    </script>
</head>

<body>
  <h1 style="text-align: center;">Ejemplo de JavaScript</h1>
  <div style="display: flex; justify-content: center; align-items: center;">
  <img id="japi" style=" align-items: center;" src="../img/japiface.jpg" alt="Feliz">
  </div>
  <div style="display: flex; justify-content: center; align-items: center;">
  <button style="margin: 10px;" onclick="Feliz()"> Feliz </button>
  <button style="margin: 10px;" onclick="Triste()">Triste</button>
  </div>

</body>
</html>
